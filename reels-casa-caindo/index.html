<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Casa Caindo Reels</title>
<style>
  html,body{margin:0;background:#000;height:100%}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;height:100vh;width:auto;max-width:100vw}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* =====================================================================
   Reels 9:16 — a casa do post de cima se solta e cai no terreno do
   post de baixo. Base: print real do feed (900x1600), enquadrado na
   área segura do Reels (topo ~215 px e base ~380 px livres para a
   interface do Instagram).
   ===================================================================== */
const W = 1080, H = 1920, K = 1.2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const range = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = t => 1 - Math.pow(1 - t, 3);
const smooth = u => u * u * (3 - 2 * u);
let seed = 1; const rnd = () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646);

/* ---------- montagem do feed (trechos do print, como um feed real) ---------- */
const POST = {
  user1: 'dek.devillekerr',
  likes2: '7', reposts2: '23',
  user2: 'terrenosdek', caption2: 'Seu terreno pronto pra receber a casa.',
};
const FONT = 'Inter, "DejaVu Sans", sans-serif';
let acc = 0;
const place = (y0, y1) => { const r = { y0, y1, top: acc, bot: acc + (y1 - y0) * K }; acc = r.bot; return r; };
const HEAD1 = place(930, 1031);                   // cabeçalho do post de cima (estilo do print)
const PA = place(0, 700);                         // foto + ações + curtidas + legenda
const DATE1 = place(866, 914);                    // "22 de agosto" do post de cima
const HEAD2 = place(930, 1031);                   // cabeçalho do post de baixo
const FIELD = place(1130, 1600);                  // foto do terreno (1,91:1)
const ACT2 = place(515, 600);                     // barra de ações do post de baixo
const LIKES2 = place(600, 655);                   // "Curtido por ..."
const CAP2_Y = acc + 26;                          // legenda do post de baixo
const SEG = [HEAD1, PA, DATE1, HEAD2, FIELD, ACT2, LIKES2];
const TOP = { y0: PA.top, y1: PA.top + 506 * K }; // foto do post de cima
const fieldY = row => FIELD.top + (row - FIELD.y0) * K;   // linha do print -> tela

const SRC = { feed: 'assets/feed.jpg', casa: 'assets/casa.png', fundo: 'assets/post_cima_sem_casa.png', perfis: 'assets/obj_perfis.png' };
const IMG = {};
window.READY = Promise.all(Object.entries(SRC).map(([k, s]) => new Promise((ok, err) => {
  const im = new Image(); im.onload = () => { IMG[k] = im; ok(); }; im.onerror = err; im.src = s;
})));
const B = { x0: 192, y0: 8, x1: 900, y1: 494 };   // caixa da casa recortada (imagem 900x506)
const HW = (B.x1 - B.x0) * K, HH = (B.y1 - B.y0) * K;   // tamanho da casa na tela (escala 1)

/* ---------- física da casa ---------- */
const T_SHAKE = 1.2, T_DROP = 2.1;
const T_FALL = 0.95;                              // tempo de queda livre
const LAND_S = 0.6;                              // escala ao assentar (mais distante, no terreno)
const LAND_BASE = fieldY(1515);                   // linha do chão no gramado
const LAND_CX = 540;
const A_LAND = 0.11;                              // inclinação ao tocar o chão (canto direito primeiro)
const T_LAND = T_DROP + T_FALL;                   // 1º toque (canto)
const T_SLAM = T_LAND + 0.26;                     // a casa tomba e assenta inteira
const DUR = T_SLAM + 3.0;
const P0 = { x: B.x1 * K, y: TOP.y0 + B.y1 * K };     // canto inferior direito, antes de cair
const P1 = { x: LAND_CX + HW * LAND_S / 2, y: LAND_BASE };
const G = 2 * (P1.y - P0.y) / (T_FALL * T_FALL);  // gravidade que fecha a conta da queda

/* a casa é desenhada a partir do canto inferior direito (pivô) */
function house(t) {
  if (t < T_DROP) {                               // tremendo, ainda presa ao post
    const k = range(t, T_SHAKE, T_DROP), amp = k * k;
    return { x: P0.x + Math.sin(t * 59) * 3 * amp, y: P0.y + Math.abs(Math.sin(t * 43)) * 2 * amp,
      a: Math.sin(t * 31) * 0.006 * amp + 0.02 * smooth(range(t, T_DROP - 0.25, T_DROP)), s: 1, ph: 0 };
  }
  if (t < T_LAND) {                               // queda livre girando devagar
    const f = t - T_DROP, u = f / T_FALL;
    return { x: lerp(P0.x, P1.x, smooth(u)), y: P0.y + 0.5 * G * f * f,
      a: lerp(0.02, A_LAND, u), s: lerp(1, LAND_S, Math.pow(u, 0.8)), ph: 1 };
  }
  const d = t - T_LAND;
  if (t < T_SLAM) {                               // tomba sobre o canto até ficar plana
    const u = d / (T_SLAM - T_LAND);
    return { x: P1.x, y: P1.y, a: A_LAND * (1 - u * u), s: LAND_S, ph: 2 };
  }
  const e = t - T_SLAM;                           // pequeno quique e assenta
  const bounce = e < 0.22 ? Math.sin(Math.PI * e / 0.22) * 0.014 : 0;
  const sq = Math.exp(-e * 10) * Math.cos(e * 40);
  return { x: P1.x, y: P1.y, a: bounce, s: LAND_S, sy: 1 - 0.035 * sq, ph: 3 };
}
function drawHouse(h, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.translate(h.x, h.y); ctx.rotate(-h.a);      // positivo = lado esquerdo levantado
  ctx.scale(h.s, h.s * (h.sy || 1));
  ctx.drawImage(IMG.casa, B.x0, B.y0, B.x1 - B.x0, B.y1 - B.y0, -HW, -HH, HW, HH);
  ctx.restore();
}

/* ---------- peças soltas (perfis) que se desprendem da estrutura ---------- */
const BITS = [];
seed = 321;
for (let i = 0; i < 7; i++) {
  const t0 = T_SHAKE + 0.45 + i * 0.12 + rnd() * 0.1;
  const sx = (B.x0 + 40 + rnd() * 260) * K, sy = TOP.y0 + (330 + rnd() * 150) * K;   // lado da estrutura metálica
  const lx = LAND_CX - HW * LAND_S / 2 - 30 + rnd() * (HW * LAND_S + 60);
  const ly = LAND_BASE - 4 + rnd() * 22;
  const T = 0.75 + rnd() * 0.3;
  BITS.push({ t0, sx, sy, lx, ly, T, g: 2 * (ly - sy) / (T * T), w: 46 + rnd() * 40,
    a0: (rnd() - .5) * 0.6, spin: (rnd() - .5) * 9, aEnd: (rnd() - .5) * 0.35, flip: rnd() < .5 });
}
function drawBits(t) {
  for (const b of BITS) {
    const f = t - b.t0; if (f < 0) continue;
    let x, y, a, s;
    if (f < b.T) { const u = f / b.T; x = lerp(b.sx, b.lx, u); y = b.sy + 0.5 * b.g * f * f; a = b.a0 + b.spin * f; s = lerp(1, LAND_S + .1, u); }
    else {                                          // quica e deita no gramado
      const e = f - b.T, hop = e < 0.25 ? Math.sin(Math.PI * e / 0.25) * 14 : 0;
      x = b.lx + Math.min(e, .25) * 40; y = b.ly - hop; a = lerp(b.a0 + b.spin * b.T, b.aEnd, clamp(e / 0.25)); s = LAND_S + .1;
    }
    const im = IMG.perfis, w = b.w * s, hh = w * im.height / im.width;
    ctx.save(); ctx.translate(x, y); ctx.rotate(a); if (b.flip) ctx.scale(-1, 1);
    ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 3;
    ctx.drawImage(im, -w / 2, -hh / 2, w, hh); ctx.restore();
  }
}

/* ---------- sombra, grama e poeira ---------- */
function clipField() { ctx.beginPath(); ctx.rect(0, FIELD.top, W, FIELD.bot - FIELD.top); ctx.clip(); }
function drawShadow(t) {
  const prox = t < T_DROP ? 0 : t < T_LAND ? Math.pow(range(t, T_DROP, T_LAND), 3) : 1;
  if (prox <= 0) return;
  const w = HW * LAND_S;
  ctx.save(); clipField(); ctx.filter = 'blur(12px)'; ctx.globalAlpha = 0.5 * prox; ctx.fillStyle = '#1d2a12';
  ctx.beginPath(); ctx.ellipse(LAND_CX + 14, LAND_BASE + 3, w * 0.53 * lerp(1.5, 1, prox), 15, 0, 0, 7); ctx.fill();
  ctx.restore();
}
const grass = document.createElement('canvas'); grass.width = W; grass.height = 70;
const gctx = grass.getContext('2d');
function drawGrassOverlap(t) {
  if (t < T_LAND) return;
  const y0 = LAND_BASE - 34;
  const srcRow = FIELD.y0 + (y0 - FIELD.top) / K;
  gctx.globalCompositeOperation = 'source-over'; gctx.clearRect(0, 0, W, 70);
  gctx.drawImage(IMG.feed, 0, srcRow, 900, 70 / K, 0, 0, W, 70);
  gctx.globalCompositeOperation = 'destination-in';
  const g = gctx.createLinearGradient(0, 0, 0, 70);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.4, 'rgba(0,0,0,.55)'); g.addColorStop(0.6, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,1)');
  gctx.fillStyle = g; gctx.fillRect(0, 0, W, 70); gctx.globalCompositeOperation = 'source-over';
  ctx.save(); clipField(); ctx.globalAlpha = range(t, T_LAND, T_SLAM + 0.1); ctx.drawImage(grass, 0, y0); ctx.restore();
}
const DUST = [];
seed = 99;
for (let i = 0; i < 170; i++) DUST.push({ x: (rnd() - .5) * 2.3, v: 0.4 + rnd() * 1.2, up: rnd(), r: 7 + rnd() * 18, life: 1.0 + rnd() * 1.6, c: rnd(), at: rnd() < .3 ? 0 : 1 });
function drawDust(t) {
  const half = HW * LAND_S / 2;
  ctx.save(); clipField(); ctx.filter = 'blur(12px)';
  for (const p of DUST) {
    const t0 = p.at ? T_SLAM : T_LAND; const d = t - t0; if (d < 0) continue;
    const k = d / p.life; if (k > 1) continue;
    const spread = easeOut(Math.min(1, d * p.v * 1.4));
    const cx = p.at ? LAND_CX : P1.x - 20;
    const x = cx + p.x * half * (p.at ? 0.8 + spread * 0.8 : 0.3 + spread * 0.5);
    const y = LAND_BASE - 4 - p.up * 60 * easeOut(Math.min(1, d * 1.3)) * p.v;
    ctx.globalAlpha = 0.17 * (1 - k) * (1 - k);
    ctx.fillStyle = p.c < .5 ? '#c9c6b8' : '#ecebe3';
    ctx.beginPath(); ctx.arc(x, y, p.r * (0.6 + spread * 1.4), 0, 7); ctx.fill();
  }
  ctx.restore();
}

/* ---------- quadro ---------- */
function heartOutline(x, y, sc) {
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
  ctx.beginPath(); ctx.moveTo(0, 9);
  ctx.bezierCurveTo(-4, 5, -15, -1, -15, -8); ctx.bezierCurveTo(-15, -14, -10, -17, -6.5, -17);
  ctx.bezierCurveTo(-3, -17, -1, -15, 0, -12.5); ctx.bezierCurveTo(1, -15, 3, -17, 6.5, -17);
  ctx.bezierCurveTo(10, -17, 15, -14, 15, -8); ctx.bezierCurveTo(15, -1, 4, 5, 0, 9); ctx.closePath();
  ctx.restore(); ctx.lineWidth = 5.2; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0c1014'; ctx.stroke();
}
function drawFeed() {
  ctx.fillStyle = '#fff'; ctx.fillRect(-40, -40, W + 80, H + 80);
  for (const s of SEG) ctx.drawImage(IMG.feed, 0, s.y0, 900, s.y1 - s.y0, 0, s.top, W, s.bot - s.top);
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  // cabeçalho do post de cima: troca o @
  const hy = r => HEAD1.top + (r - HEAD1.y0) * K;
  ctx.fillStyle = '#fff'; ctx.fillRect(105 * K, hy(962), 260 * K, 32 * K);
  ctx.fillStyle = '#0c1014'; ctx.font = `600 ${27.5 * K}px ${FONT}`; ctx.fillText(POST.user1, 109 * K, hy(978));
  // ações do post de baixo: coração vazio (o usuário é quem curte) e outros números
  const ay = r => ACT2.top + (r - ACT2.y0) * K;
  ctx.fillStyle = '#fff';
  ctx.fillRect(18 * K, ay(528), 66 * K, 58 * K);
  ctx.fillRect(163 * K, ay(538), 30 * K, 40 * K);
  ctx.fillRect(268 * K, ay(538), 46 * K, 40 * K);
  heartOutline(50 * K, ay(560), 1.75 * K);
  ctx.fillStyle = '#0c1014'; ctx.font = `500 ${26 * K}px ${FONT}`;
  ctx.fillText(POST.likes2, 167 * K, ay(558)); ctx.fillText(POST.reposts2, 271 * K, ay(558));
  // legenda do post de baixo
  ctx.font = `600 ${26 * K}px ${FONT}`; ctx.fillText(POST.user2, 26 * K, CAP2_Y);
  const uw = ctx.measureText(POST.user2).width;
  ctx.font = `400 ${26 * K}px ${FONT}`; ctx.fillText(POST.caption2, 26 * K + uw + 10, CAP2_Y);
}
function shakeAt(t, t0, amp) { const d = t - t0; if (d < 0) return [0, 0]; const e = Math.exp(-d * 8); return [Math.sin(d * 71) * amp * e, Math.cos(d * 53) * amp * 1.3 * e]; }
function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const s1 = shakeAt(t, T_LAND, 5), s2 = shakeAt(t, T_SLAM, 13);
  ctx.translate(s1[0] + s2[0], s1[1] + s2[1]);
  drawFeed();
  if (t >= T_SHAKE) {                             // a casa vira um objeto solto
    ctx.fillStyle = '#fff'; ctx.fillRect(0, TOP.y0, W, TOP.y1 - TOP.y0);
    const f = 1 - range(t, T_DROP, T_DROP + 0.45);  // fundo do post some: post fica em branco
    if (f > 0) { ctx.globalAlpha = f; ctx.drawImage(IMG.fundo, 0, TOP.y0, W, TOP.y1 - TOP.y0); ctx.globalAlpha = 1; }
  }
  drawShadow(t);
  const h = house(t);
  if (t >= T_SHAKE) {
    if (h.ph === 1) for (let k = 2; k >= 1; k--) { const q = house(t - k * 0.014); if (q.ph === 1) drawHouse(q, 0.1); }
    drawHouse(h);
  }
  drawBits(t);
  drawGrassOverlap(t);
  drawDust(t);
}
window.renderFrame = renderFrame;
window.DUR = DUR; window.T_LAND = T_LAND; window.T_SLAM = T_SLAM;

if (!/render=1/.test(location.search)) {
  window.READY.then(() => {
    const st = performance.now();
    const loop = now => { renderFrame(((now - st) / 1000) % (DUR + .5)); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
</body>
</html>
